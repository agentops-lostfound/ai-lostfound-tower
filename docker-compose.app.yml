# 11/5: 재민 님 화면(app-web)만 켜고, 접수는 관제탑 API(8100) → 팀 DB 로 보낸다(README.docker.md)
#   켜기: docker compose -f docker-compose.app.yml up --build -d   → http://localhost:8080
#   예전처럼 화면 전용 서버·DB 까지 따로 켜려면(standalone, 팀 DB 와 별개):
#   TOWER_URL=http://app-api:8000 docker compose --env-file .env.app -f docker-compose.app.yml --profile standalone up --build -d
name: lostfound-app   # 팀 DB compose(프로젝트 ai-lostfound-tower)와 이름이 겹치지 않게
services:
  app-web:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      TOWER_URL: ${TOWER_URL:-http://host.docker.internal:8100}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 컨테이너 안에서 이 PC(관제탑)를 부르는 이름(Linux 에서도 되게)
    restart: unless-stopped
  app-db:
    profiles: ["standalone"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lostfound_app}
      POSTGRES_USER: ${POSTGRES_USER:-lostfound_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-standalone-dev-only}
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lostfound_app} -d ${POSTGRES_DB:-lostfound_app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app-api:
    profiles: ["standalone"]
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lostfound_app}:${POSTGRES_PASSWORD:-standalone-dev-only}@app-db:5432/${POSTGRES_DB:-lostfound_app}
      UPLOAD_DIR: /app/uploads
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      app-db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  app_postgres_data:
  app_uploads:
