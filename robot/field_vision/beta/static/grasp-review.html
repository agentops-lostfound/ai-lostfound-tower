<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>집기 재시도 · 판정 기록</title><link rel="stylesheet" href="/static/manual.css"></head><body><header><div><b>집기 재시도 · 판정 기록</b><small>분홍색 튜브 시험 · 규칙 기반 후보 · 성공 미확정</small></div><a href="/manual">수동 제어·정지 ↗</a></header><main><p id="result" class="summary" role="status"></p><div class="layout"><section><h2>들기 전</h2><img id="before" style="width:100%;max-width:640px" alt="닫기 정지 직후 ARM 영상"><h2>확인 들기 후</h2><img id="after" style="width:100%;max-width:640px" alt="10mm 확인 들기 후 ARM 영상"></section><aside><h2>추가 닫기 중단 근거</h2><div id="facts" style="line-height:1.9"></div><p>현재 카메라의 2D 겹침은 물건과 손가락이 실제로 닿았다는 증거가 아닙니다. 부하 값도 압력(N)으로 보정된 값은 아닙니다. 이 시험은 사용자 육안 확인을 최종 결과로 기록합니다.</p></aside></div></main><script>fetch('/static/grasp-review.json?t='+Date.now()).then(r=>r.json()).then(d=>{document.getElementById('result').textContent=d.result;document.getElementById('before').src=d.before;document.getElementById('after').src=d.after;const facts=document.getElementById('facts');d.facts.forEach(text=>{const p=document.createElement('p');p.textContent=text;facts.append(p);});}).catch(e=>document.getElementById('result').textContent=e.message);</script></body></html>
