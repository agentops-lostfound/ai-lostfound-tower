<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관제탑 실시간</title>
<!--
  관제탑 실시간 화면 (LF-17·LF-29, 11/4) — docs/design/virtual_demo.md
  한줄 설명: 관제탑이 디스코드 관제 채널로 보내는 진행을 같은 순서로 보여 주고, 가상 시연(TOWER_SIM=1)이면
            보관함 탑뷰 그림 위에서 물건 배치와 로봇팔 움직임까지 보여 준다. /live/state 를 0.4초마다 읽는다.
  외부 파일·글꼴을 쓰지 않는다(교육원 PC 인터넷이 끊겨도 열림).
-->
<style>
:root{
  --bg:#f5f7fb; --panel:#ffffff; --ink:#1d2433; --sub:#5b6577; --line:#e3e8f0; --soft:#eef2f8;
  --accent:#2f6fec; --accent-soft:#e6efff; --ok:#1f9d61; --ok-soft:#e3f6ec; --bad:#d64545; --bad-soft:#fdeaea;
  --warn:#c98a00; --warn-soft:#fff5d9; --team:#7a4bd6; --team-soft:#f1eaff;
  --bench:#fbfaf6; --bin:#f1efe7; --binline:#cfc8b4; --arm:#3a4660; --arm2:#5f6f94;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#11151d; --panel:#181e29; --ink:#e7ecf5; --sub:#9aa6ba; --line:#2a3242; --soft:#1f2735;
    --accent:#6f9bff; --accent-soft:#1f2c47; --ok:#43c487; --ok-soft:#183427; --bad:#ff7070; --bad-soft:#3a1d1d;
    --warn:#f0b93a; --warn-soft:#3a2f12; --team:#b394ff; --team-soft:#2a2142;
    --bench:#1c2230; --bin:#232b3b; --binline:#46506a; --arm:#c9d3e6; --arm2:#8d9ab5; color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px}
h1{font-size:18px;margin:0 8px 0 0;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--sub);font-size:12.5px;white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sub)}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
.spacer{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.stop{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
button.confirm{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
main{display:grid;grid-template-columns:330px minmax(0,1fr) 340px;gap:14px;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
@media (max-width:1180px){main{grid-template-columns:minmax(0,1fr) 320px}.col-left{grid-column:1/-1;order:3}}
@media (max-width:760px){main{grid-template-columns:minmax(0,1fr)}.col-right{order:4}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card h2{font-size:13px;margin:0 0 8px;color:var(--sub);font-weight:600;letter-spacing:.02em}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
/* 이야기 */
.story{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.story+.story{margin-top:10px}
.story .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.story .kind{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:6px}
.kind.found{background:var(--accent-soft);color:var(--accent)} .kind.lost{background:var(--team-soft);color:var(--team)}
.story .title{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ids{color:var(--sub);font-size:12px;margin:2px 0 6px;font-family:ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.steps li{display:grid;grid-template-columns:18px 1fr;gap:6px;align-items:start;font-size:13px;color:var(--sub)}
.steps li .m{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-top:3px}
.steps li.done{color:var(--ink)} .steps li.done .m{background:var(--ok);border-color:var(--ok)}
.steps li.active{color:var(--ink);font-weight:600} .steps li.active .m{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);animation:pulse 1s infinite}
.steps li.fail{color:var(--bad);font-weight:600} .steps li.fail .m{background:var(--bad);border-color:var(--bad)}
.steps li small{display:block;color:var(--sub);font-weight:400;font-size:11.5px;overflow-wrap:anywhere}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
.result{margin-top:8px;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600}
.result.ok{background:var(--ok-soft);color:var(--ok)} .result.fail{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--sub);font-size:13px}
/* 탑뷰 */
.view{position:relative}
svg{display:block;width:100%;height:auto;max-width:100%}
.phase{position:absolute;right:14px;top:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-weight:600;font-size:13px}
.phase.stopped{background:var(--bad);border-color:var(--bad);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--sub);font-size:12px;margin-top:6px}
.places{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.place{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;min-height:58px}
.place b{font-size:12.5px} .place .row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tok{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 6px;border-radius:6px;background:var(--soft);font-family:ui-monospace,Consolas,monospace}
.tok i{width:9px;height:9px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.2)}
/* 기록 */
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:72vh;overflow:auto}
.log li{border-left:3px solid var(--line);padding:4px 8px;background:var(--soft);border-radius:0 8px 8px 0;font-size:12.5px;overflow-wrap:anywhere}
.log li.progress{border-color:var(--accent)} .log li.alert{border-color:var(--bad);background:var(--bad-soft)}
.log li.team{border-color:var(--team);background:var(--team-soft)} .log li.result{border-color:var(--ok);background:var(--ok-soft)}
.log li .t{color:var(--sub);font-size:11px;font-family:ui-monospace,Consolas,monospace;margin-right:6px}
.log li .b{color:var(--sub);display:block}
/* 시험 입력 */
.try textarea{width:100%;min-height:56px;resize:vertical;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);color:var(--ink)}
.try .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.try .msg{margin-top:6px;font-size:12.5px;color:var(--sub);overflow-wrap:anywhere}
.try .q{margin-top:8px;padding:8px;border-radius:8px;background:var(--warn-soft)}
.try .q input{width:100%;margin-top:4px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.hint{color:var(--sub);font-size:12px;margin-top:4px}
.s-bench{fill:var(--bench);stroke:var(--line)} .s-bin{fill:var(--bin);stroke:var(--binline);stroke-width:2}
.s-slot{fill:none;stroke:var(--binline);stroke-dasharray:4 4} .s-sub{fill:var(--sub)} .s-acc{fill:var(--accent)}
.s-basket{fill:none;stroke:var(--accent);stroke-width:2.5} .s-arm{fill:var(--arm)}
.s-l1{stroke:var(--arm);stroke-width:16;stroke-linecap:round} .s-l2{stroke:var(--arm2);stroke-width:12;stroke-linecap:round}
.s-ring{fill:none;stroke:var(--arm);stroke-width:4}
.s-jaw{fill:var(--arm)} .s-shadow{fill:var(--arm);opacity:.12}
/* 경보 띠 */
.banner{margin:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));padding:10px 14px;border-radius:10px;
  background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner small{color:var(--sub);font-weight:400}
[hidden]{display:none!important}   /* display 를 지정한 요소도 hidden 이면 숨김(경보 띠가 빈 채로 보이던 문제) */
/* 로봇팔 관절 */
.robot-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.joints{display:grid;gap:7px}
.joint{display:grid;grid-template-columns:22px minmax(0,1fr) 62px;gap:8px;align-items:center;font-size:12.5px}
.joint .id{width:22px;height:22px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:11.5px}
.joint .nm{min-width:0}
.joint .nm b{font-weight:600} .joint .nm code{color:var(--sub);font-size:11px}
.joint .bar{height:6px;border-radius:4px;background:var(--soft);position:relative;margin-top:3px;overflow:hidden}
.joint .bar i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:4px}
.joint .bar.mid::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--sub);opacity:.5}
.joint .val{text-align:right;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.robot-note{color:var(--sub);font-size:11.5px;margin-top:8px;line-height:1.5}
.story .time{margin-left:auto;color:var(--sub);font-size:11.5px;font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<header>
  <h1>관제탑 실시간</h1>
  <span class="chip"><span class="dot" id="conn"></span><span id="connText">연결 중</span></span>
  <span class="chip" id="modeChip">모드 <b id="mode">-</b></span>
  <span class="chip">로봇 <b id="armChip">-</b></span>
  <span class="spacer"></span>
  <button class="stop" id="btnStop" title="반환 진행 중에도 누를 수 있음">🛑 정지</button>
  <button id="btnHome" title="로봇 주변을 확인한 뒤에만">원점 복귀</button>
  <button id="btnReset" hidden>가상 세계 초기화</button>
</header>
<div class="banner" id="banner" hidden></div>
<main>
  <section class="col col-left">
    <div class="card">
      <h2>진행 중인 이야기</h2>
      <div id="stories"><p class="empty">아직 신고가 없습니다. 디스코드 분실물 채널이나 아래 시험 입력으로 시작하세요.</p></div>
    </div>
    <div class="card try" id="tryCard" hidden>
      <h2>시험 입력 (디스코드 없이)</h2>
      <textarea id="tryText" placeholder="예) 서면역 5번 출구 앞에서 검정 카드지갑 주웠어요"></textarea>
      <div class="btns">
        <button class="primary" data-kind="found">습득 신고</button>
        <button data-kind="lost">분실 신고</button>
      </div>
      <div class="hint">꼬리표: #집기실패 · #보정실패 · #신분증불일치 · #수동인계</div>
      <div class="msg" id="tryMsg"></div>
      <div class="q" id="tryQ" hidden><b id="tryQText"></b><input id="tryAns" placeholder="답 (모르면 모름)"><div class="btns"><button id="tryAnsBtn" class="primary">답하기</button></div></div>
    </div>
  </section>

  <section class="col">
    <div class="card view">
      <h2>본센터 작업대 (탑뷰, mm)</h2>
      <div class="phase" id="phase">대기</div>
      <svg id="bench" viewBox="-20 -20 680 455" role="img" aria-label="보관함과 로봇팔 탑뷰"></svg>
      <div class="legend"><span>■ 표식(ArUco) 2개 — 보정 기준</span><span>점선 칸 = 보관함 12칸</span><span>회색 팔 = SO-101 팔로워(위에서 본 모습) · 옅은 원 = 집게 높이(클수록 높음)</span></div>
      <div class="places" id="places"></div>
    </div>
  </section>

  <section class="col col-right">
    <div class="card" id="robotCard" hidden>
      <h2>로봇팔 SO-101 · 팔로워(흰색)</h2>
      <div class="robot-meta" id="robotMeta"></div>
      <div class="joints" id="joints"></div>
      <div class="robot-note" id="robotNote"></div>
    </div>
    <div class="card">
      <h2>관제 메시지 (디스코드 관제 채널과 같은 내용)</h2>
      <ul class="log" id="log"></ul>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const COLORS = {"검정":"#2b2b2b","흰색":"#f7f7f7","회색":"#a2a8b1","빨강":"#e05252","파랑":"#3d7be0","남색":"#2e3f73",
                  "초록":"#3fa36b","노랑":"#f2c94c","갈색":"#8b5e3c","분홍":"#e9a6b8"};
  const CAT = {"지갑":"지갑","USB":"USB","립밤":"립밤","모형폰":"폰","핸드크림":"크림","보조배터리":"배터리"};
  const LOC = {kiosk:"등록기계", transit:"이동 중", bin:"보관함", gripper:"그리퍼", basket:"바구니", handed:"인계 완료", staff:"직원 보관"};
  let seq = 0, world = null, shown = {x: 240, y: 345, z: 150, g: 30}, target = {x: 240, y: 345, z: 150, g: 30}, failCount = 0, pendingId = null;
  let lastAlert = null;   // 최근 경보(20초 동안 위쪽 띠로 보여 줌)
  const L1 = 230, L2 = 230;
  const NS = "http://www.w3.org/2000/svg";

  // ---------- 작업대 그림 ----------
  function drawBench(b) {
    const svg = $("bench");
    const [W, H] = b.size_mm, [x1, y1, x2, y2] = b.bin_mm, [bx, by] = b.basket_mm, [rx, ry] = b.base_mm;
    let s = `<rect x="0" y="0" width="${W}" height="${H}" rx="10" class="s-bench"/>`;
    s += `<rect x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}" rx="8" class="s-bin"/>`;
    s += `<text x="${x1+8}" y="${y2+16}" font-size="12" class="s-sub">공용 보관함</text>`;
    b.slots_mm.forEach(([sx, sy], i) => {
      s += `<rect x="${sx-52}" y="${sy-38}" width="104" height="76" rx="8" class="s-slot"/>`;
      s += `<text x="${sx-46}" y="${sy-26}" font-size="10" class="s-sub">${i+1}</text>`;
    });
    b.markers_mm.forEach(([mx, my], i) => {
      s += `<g transform="translate(${mx-9},${my-9})"><rect width="18" height="18" fill="#111"/><rect x="4" y="4" width="5" height="5" fill="#fff"/><rect x="9" y="9" width="5" height="5" fill="#fff"/></g>`;
    });
    s += `<rect x="${bx-55}" y="${by-45}" width="110" height="90" rx="14" class="s-basket"/>`;
    s += `<text x="${bx}" y="${by+62}" text-anchor="middle" font-size="12" class="s-acc">바구니(인계)</text>`;
    s += `<g id="items"></g>`;
    s += `<circle cx="${rx}" cy="${ry}" r="24" class="s-arm" opacity=".9"/>`;
    s += `<g id="arm"><line id="a1" class="s-l1"/><line id="a2" class="s-l2"/>`;
    s += `<circle id="elb" r="9" class="s-arm"/><g id="grip"><circle id="shadow" r="20" class="s-shadow"/><rect id="jawL" x="-14" y="-4" width="5" height="18" rx="2" class="s-jaw"/><rect id="jawR" x="9" y="-4" width="5" height="18" rx="2" class="s-jaw"/><circle r="5" class="s-arm"/></g><g id="held"></g></g>`;
    svg.innerHTML = s;
  }

  function itemShape(it, x, y) {
    const c = COLORS[it.color] || "#b9b4ff";
    const tip = `<title>${esc(it.item_id)} · ${esc(it.category || "")} · ${esc(it.color || "")} · ${esc(it.status)}</title>`;
    const light = ["흰색","노랑"].includes(it.color);
    const label = CAT[it.category] || "?";
    const short = it.item_id.slice(-4);
    return `<g transform="translate(${x},${y})">${tip}<rect x="-38" y="-24" width="76" height="48" rx="8" fill="${c}" stroke="rgba(0,0,0,.25)"/>`+
      `<text y="-4" text-anchor="middle" font-size="13" font-weight="700" fill="${light?"#222":"#fff"}">${esc(label)}</text>`+
      `<text y="13" text-anchor="middle" font-size="10.5" fill="${light?"#333":"#eee"}">${esc(it.item_id.slice(0,1))}…${esc(short)}</text></g>`;
  }

  function renderItems() {
    if (!world) return;
    const g = $("items"); if (!g) return;
    const [bx, by] = world.bench.basket_mm;
    let s = "", basketN = 0;
    for (const it of world.items) {
      if (it.loc === "bin" && it.mm) s += itemShape(it, it.mm[0], it.mm[1]);
      if (it.loc === "basket") { s += itemShape(it, bx - 12 + basketN * 8, by - 4 + basketN * 6); basketN++; }
    }
    g.innerHTML = s;
    const held = world.items.find(i => i.loc === "gripper");
    $("held").innerHTML = held ? itemShape(held, 0, 0) : "";
    // 등록기계·이동 중·인계 완료
    const groups = {"KIOSK-C 서면역 등록기계": i => i.loc === "kiosk" && i.machine_id === "KIOSK-C",
                    "KIOSK-A 해운대 등록기계": i => i.loc === "kiosk" && i.machine_id === "KIOSK-A",
                    "KIOSK-B 중앙 등록기계": i => i.loc === "kiosk" && i.machine_id === "KIOSK-B",
                    "🚚 본센터로 이동 중": i => i.loc === "transit",
                    "🤝 인계 완료 · 직원 보관": i => i.loc === "handed" || i.loc === "staff"};
    $("places").innerHTML = Object.entries(groups).map(([name, f]) => {
      const list = world.items.filter(f);
      return `<div class="place"><b>${esc(name)}</b><div class="row">${list.length ? list.map(i =>
        `<span class="tok" title="${esc(i.status)}"><i style="background:${COLORS[i.color]||"#b9b4ff"}"></i>${esc(i.item_id)}${i.loc==="staff"?" (직원)":""}</span>`).join("") :
        '<span class="empty">없음</span>'}</div></div>`;
    }).join("");
  }

  function placeArm(x, y, z, g) {
    if (!world) return;
    const [rx, ry] = world.bench.base_mm;
    let dx = x - rx, dy = y - ry, d = Math.hypot(dx, dy);
    const max = L1 + L2 - 1; if (d > max) { dx *= max / d; dy *= max / d; d = max; }
    const a = Math.atan2(dy, dx), k = Math.acos(Math.min(1, (L1*L1 + d*d - L2*L2) / (2*L1*d)));
    // 팔꿈치 두 방향 중 위쪽(작업대 안쪽)으로 꺾이는 쪽을 쓴다(아래로 꺾이면 그림 밖으로 나감)
    const e1 = [rx + L1 * Math.cos(a + k), ry + L1 * Math.sin(a + k)], e2 = [rx + L1 * Math.cos(a - k), ry + L1 * Math.sin(a - k)];
    const [ex, ey] = e1[1] <= e2[1] ? e1 : e2;
    const set = (el, o) => Object.entries(o).forEach(([k2, v]) => el.setAttribute(k2, v));
    set($("a1"), {x1: rx, y1: ry, x2: ex, y2: ey});
    set($("a2"), {x1: ex, y1: ey, x2: x, y2: y});
    set($("elb"), {cx: ex, cy: ey});
    $("grip").setAttribute("transform", `translate(${x},${y})`);
    const gap = 3 + g * 0.16;                                   // 집게 열림 %, 화면에서 두 집게 사이 간격
    $("jawL").setAttribute("x", -gap - 5); $("jawR").setAttribute("x", gap);
    $("shadow").setAttribute("r", 10 + Math.max(0, z) / 7);    // 집게가 높을수록 옅은 원이 큼
    $("held").setAttribute("transform", `translate(${x},${y}) scale(.7)`);
  }

  function tick() {          // 화면에서 팔이 부드럽게 따라가게(관제탑은 0.2초 간격으로 위치를 바꿈)
    for (const k of ["x", "y", "z", "g"]) shown[k] += (target[k] - shown[k]) * 0.22;
    placeArm(shown.x, shown.y, shown.z, shown.g);
    requestAnimationFrame(tick);
  }

  // ---------- 로봇팔 관절 ----------
  function renderRobot(w) {
    const r = w.robot, a = w.arm;
    if (!r) return;
    $("robotCard").hidden = false;
    const held = a.holding ? `들고 있음 ${a.holding}` : "빈 집게";
    $("robotMeta").innerHTML = [`단계 ${a.stopped ? "정지" : a.phase}`, `집게 높이 ${Math.round(a.z)}mm`, held]
      .map(t => `<span class="chip">${esc(t)}</span>`).join("");
    $("joints").innerHTML = r.joints.map(j => {
      const v = (a.joints || {})[j.name] ?? 0;
      let bar;
      if (j.name === "gripper") bar = `<div class="bar"><i style="left:0;width:${Math.max(0, Math.min(100, v))}%"></i></div>`;
      else {                                                    // -180~180° → 가운데 0 기준 막대
        const p = Math.max(-180, Math.min(180, v)) / 180 * 50;
        bar = `<div class="bar mid"><i style="left:${p < 0 ? 50 + p : 50}%;width:${Math.abs(p)}%"></i></div>`;
      }
      return `<div class="joint"><span class="id">${j.id}</span><div class="nm"><b>${esc(j.label)}</b> <code>${esc(j.name)}</code>${bar}</div>`+
             `<span class="val">${v.toFixed(1)}${esc(j.unit)}</span></div>`;
    }).join("");
    $("robotNote").innerHTML = `${esc(r.role)}<br>${esc(r.leader)}<br>카메라: ${r.cameras.map(esc).join(" · ")}<br>` +
      `모터 6개 = 움직이는 축 5개 + 집게 1개 · 각도는 가상 계산(추정), 진짜 값은 로봇 부품이 보정값으로 읽음`;
  }

  function renderBanner(w) {
    const b = $("banner");
    if (w && w.arm.stopped) {
      b.hidden = false; b.innerHTML = `🛑 로봇 정지 <small>주변을 확인한 뒤 위쪽 '원점 복귀' 버튼(두 번 눌러 확인)</small>`;
    } else if (lastAlert && Date.now() / 1000 - lastAlert.t < 20) {
      b.hidden = false; b.innerHTML = `⚠️ ${esc(lastAlert.title)} <small>${esc(lastAlert.body || "")}</small>`;
    } else b.hidden = true;
  }

  // ---------- 이야기 ----------
  function renderStories(stories) {
    if (!stories || !stories.length) return;
    $("stories").innerHTML = stories.map(st => {
      const ids = Object.entries(st.ids || {}).map(([k, v]) => `${{item_id:"물건",claim_id:"찾기",case_id:"사례"}[k]||k} ${v}`).join(" · ");
      const steps = st.stages.map(s => `<li class="${s.state}"><span class="m"></span><span>${esc(s.label)}${s.detail ? `<small>${esc(s.detail)}</small>` : ""}</span></li>`).join("");
      const res = st.result ? `<div class="result ${st.result.ok ? "ok" : "fail"}">${st.result.ok ? "✅" : "⚠️"} ${esc(st.result.text)}</div>` : "";
      const secs = Math.round(((st.result ? st.result.t : Date.now() / 1000) - st.started));
      return `<div class="story"><div class="top"><span class="kind ${st.kind}">${st.kind === "found" ? "습득" : "분실"} ${esc(st.story_id)}</span><span class="title">${esc(st.title)}</span><span class="time">${secs}초</span></div>`+
             `<div class="ids">${esc(ids)}</div><ol class="steps">${steps}</ol>${res}</div>`;
    }).join("");
  }

  function addEvents(evs) {
    const log = $("log");
    for (const e of evs) {
      if (e.channel === "stage") continue;
      if (e.channel === "alert") lastAlert = e;
      const li = document.createElement("li");
      li.className = e.channel;
      const dt = new Date(e.t * 1000), p2 = n => String(n).padStart(2, "0");
      const t = `${p2(dt.getHours())}:${p2(dt.getMinutes())}:${p2(dt.getSeconds())}`;
      li.innerHTML = `<span class="t">${t}${e.story ? " " + esc(e.story) : ""}</span>${esc(e.title)}${e.body && e.channel !== "result" ? `<span class="b">${esc(e.body)}</span>` : ""}`;
      log.prepend(li);
    }
    while (log.children.length > 200) log.lastChild.remove();
  }

  // ---------- 읽기 ----------
  async function poll() {
    try {
      const r = await fetch(`/live/state?after=${seq}`, {cache: "no-store"});
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      failCount = 0;
      $("conn").className = "dot on"; $("connText").textContent = d.busy ? "연결됨 · 반환 진행 중" : "연결됨";
      $("mode").textContent = d.sim ? "가상 시연" : "진짜 부품";
      $("tryCard").hidden = !d.sim; $("btnReset").hidden = !d.sim;
      if (d.world) {
        if (!world) drawBench(d.world.bench);
        world = d.world;
        target = {x: world.arm.x, y: world.arm.y, z: world.arm.z ?? 150, g: world.arm.gripper ?? 30};
        renderRobot(world);
        renderItems();
        const ph = $("phase");
        ph.textContent = world.arm.stopped ? "🛑 정지 — 확인 후 원점 복귀" : world.arm.phase;
        ph.className = "phase" + (world.arm.stopped ? " stopped" : "");
        $("armChip").textContent = world.arm.stopped ? "정지" : world.arm.phase;
      } else {
        $("armChip").textContent = "진짜 부품(/health)";
      }
      addEvents(d.events || []);
      renderBanner(d.world);
      renderStories(d.stories);
      seq = d.seq;
    } catch (e) {
      failCount++;
      if (failCount > 2) { $("conn").className = "dot off"; $("connText").textContent = "관제탑 연결 끊김"; }
    }
    setTimeout(poll, 400);
  }

  // ---------- 버튼 ----------
  async function post(url, body) {
    const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
    let d = null; try { d = await r.json(); } catch (_) {}
    if (!r.ok) throw new Error(typeof d?.detail === "string" ? d.detail : (d?.detail?.message || `오류 ${r.status}`));
    return d;
  }
  $("btnStop").onclick = () => post("/robot/stop").catch(e => $("tryMsg").textContent = e.message);
  let homeArmed = null;
  $("btnHome").onclick = () => {
    const b = $("btnHome");
    if (!homeArmed) {
      b.classList.add("confirm"); b.textContent = "주변 확인했나요? 한 번 더";
      homeArmed = setTimeout(() => { homeArmed = null; b.classList.remove("confirm"); b.textContent = "원점 복귀"; }, 4000);
      return;
    }
    clearTimeout(homeArmed); homeArmed = null; b.classList.remove("confirm"); b.textContent = "원점 복귀";
    post("/robot/home", {staff_confirmed: true}).catch(e => $("tryMsg").textContent = e.message);
  };
  $("btnReset").onclick = () => post("/sim/reset").then(() => $("tryMsg").textContent = "초기화했습니다").catch(e => $("tryMsg").textContent = e.message);

  document.querySelectorAll(".try [data-kind]").forEach(btn => btn.onclick = async () => {
    const text = $("tryText").value.trim(); if (!text) return;
    const kind = btn.dataset.kind;
    $("tryMsg").textContent = "보내는 중…"; $("tryQ").hidden = true;
    try {
      const d = await post(`/sim/${kind}`, {text});
      if (d.pending_id) {
        pendingId = d.pending_id; $("tryQText").textContent = "확인 질문: " + d.question; $("tryQ").hidden = false;
        $("tryMsg").textContent = `후보 ${d.candidates.length}개 — 확인 질문에 답하면 찾기 요청을 만듭니다`;
      } else if (kind === "found") {
        $("tryMsg").textContent = `접수 번호 ${d.item_id} · ${d.place_text} · ${d.features}`;
      } else {
        $("tryMsg").textContent = `찾기 번호 ${d.claim_id} · 후보 ${d.item_id} · 확인 질문 ${d.quiz_passed ? "통과" : "미통과"}`;
      }
    } catch (e) { $("tryMsg").textContent = "⚠️ " + e.message; }
  });
  $("tryAnsBtn").onclick = async () => {
    if (!pendingId) return;
    try {
      const d = await post(`/sim/lost/${pendingId}/answer`, {text: $("tryAns").value.trim() || "모름"});
      pendingId = null; $("tryQ").hidden = true; $("tryAns").value = "";
      $("tryMsg").textContent = `찾기 번호 ${d.claim_id} · 후보 ${d.item_id} · 확인 질문 ${d.quiz_passed ? "통과" : "미통과"}`;
    } catch (e) { $("tryMsg").textContent = "⚠️ " + e.message; }
  };

  poll();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
