<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>해운대역 습득물 발견 등록</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#17382c;background:#f3f7f4}
    *{box-sizing:border-box}body{margin:0;padding:28px 16px}.wrap{max-width:760px;margin:auto}
    header{background:linear-gradient(135deg,#145c42,#23845e);color:#fff;padding:26px;border-radius:18px;margin-bottom:18px}
    h1{font-size:clamp(24px,5vw,32px);margin:0 0 8px}header p{margin:0;opacity:.9}
    form,.result{background:#fff;border:1px solid #dce8df;border-radius:16px;padding:22px;box-shadow:0 5px 18px #153d2910}
    h2{font-size:19px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
    label{display:block;font-weight:650;font-size:14px;margin:13px 0 6px}
    input,select,textarea{width:100%;padding:12px;border:1px solid #cbd9cf;border-radius:9px;font:inherit;background:#fff;color:#17382c}
    textarea{min-height:96px;resize:vertical}.full{grid-column:1/-1}
    .hint{font-size:12px;color:#64766b;line-height:1.6;margin:8px 0 0}
    button{border:0;border-radius:10px;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer}
    .submit{background:#19734f;color:#fff;width:100%;margin-top:20px}.download{background:#e5f2e9;color:#145c42;margin-top:12px}
    .result{margin-top:16px;border-color:#a9d3b7}.result[hidden]{display:none}
    .error{color:#b42318;font-size:13px;margin-top:10px}.required{color:#b42318}
    @media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}body{padding:16px 10px}form{padding:17px}}
  </style>
</head>
<body>
<main class="wrap">
  <header>
    <p>AI LOST &amp; FOUND · FINDER SERVICE</p>
    <h1>해운대역 습득물 발견 등록</h1>
    <p>발견한 물건의 정보와 정확한 발견 위치·일시를 등록해 주세요.</p>
  </header>
  <form id="found-form">
    <section>
      <h2>1. 발견한 물건</h2>
      <div class="grid">
        <div>
          <label for="category">물건 종류 <span class="required">*</span></label>
          <select id="category" name="category" required>
            <option value="">종류 선택</option>
            <option>지갑</option><option>가방</option><option>휴대전화</option>
            <option>전자기기</option><option>의류</option><option>액세서리</option>
            <option>우산</option><option>열쇠</option><option>카드·신분증</option>
            <option>서류·책</option><option>현금</option><option>기타</option>
          </select>
        </div>
        <div>
          <label for="item-name">발견한 물건 이름 <span class="required">*</span></label>
          <input id="item-name" name="item_name" required maxlength="100" placeholder="예: 검정색 가죽 지갑">
        </div>
        <div>
          <label for="color">색상</label>
          <select id="color" name="color">
            <option value="">선택 안 함</option><option>검정</option><option>흰색</option>
            <option>회색</option><option>갈색</option><option>파랑</option>
            <option>빨강</option><option>초록</option><option>노랑</option><option>기타</option>
          </select>
        </div>
        <div>
          <label for="material">재질</label>
          <select id="material" name="material">
            <option value="">선택 안 함</option><option>가죽</option><option>천·패브릭</option>
            <option>금속</option><option>플라스틱</option><option>고무</option>
            <option>종이</option><option>기타</option><option>잘 모름</option>
          </select>
        </div>
        <div class="full">
          <label for="description">물건 특징 및 상태</label>
          <textarea id="description" name="description" maxlength="2000" placeholder="예: 검정색 직사각형 지갑이며 모서리에 작은 흠집이 있습니다."></textarea>
        </div>
      </div>
    </section>
    <hr style="border:0;border-top:1px solid #e5ece7;margin:22px 0">
    <section>
      <h2>2. 발견 장소</h2>
      <label for="found-place">해운대역 발견 장소 <span class="required">*</span></label>
      <select id="found-place" name="found_place" required>
        <option value="">장소 선택</option>
        <option>해운대역 1번 출구 주변</option>
        <option>해운대역 2번 출구 주변</option>
        <option>해운대역 대합실</option>
        <option>해운대역 개찰구 주변</option>
        <option>해운대역 승강장</option>
      </select>
      <label for="place-detail">세부 위치</label>
      <input id="place-detail" name="place_detail" maxlength="200" placeholder="예: 의자 아래, 안내판 옆, 출입문 근처">
      <p class="hint">위 5개 장소는 초기 등록용 분류입니다. 실제 역 시설의 공식 구역 명칭과 일치하는지 운영 전 확인해 주세요.</p>
    </section>
    <hr style="border:0;border-top:1px solid #e5ece7;margin:22px 0">
    <section>
      <h2>3. 발견 날짜와 시간</h2>
      <div class="grid">
        <div>
          <label for="found-date">발견 날짜 <span class="required">*</span></label>
          <input id="found-date" name="found_date" type="date" required>
        </div>
        <div>
          <label for="found-time">발견 시간 <span class="required">*</span></label>
          <input id="found-time" name="found_time" type="time" required>
        </div>
      </div>
    </section>
    <p id="form-error" class="error" role="alert"></p>
    <button class="submit" type="submit">습득물 등록 내용 확인</button>
  </form>
  <section id="result" class="result" aria-live="polite" hidden>
    <h2>등록 내용이 준비되었습니다.</h2>
    <p id="summary"></p>
    <p class="hint">현재 버전은 브라우저에서 입력 내용을 JSON 파일로 내보내는 GitHub 프론트엔드 시제품입니다. 실제 DB 등록은 백엔드 API 연결 후 활성화됩니다.</p>
    <button id="download" class="download" type="button">등록 데이터 JSON 다운로드</button>
  </section>
</main>
<script>
(() => {
  const form = document.getElementById('found-form');
  const result = document.getElementById('result');
  let payload = null;
  const value = id => document.getElementById(id).value.trim();
  form.addEventListener('submit', event => {
    event.preventDefault();
    document.getElementById('form-error').textContent = '';
    if (!form.reportValidity()) return;
    payload = {
      item: {
        category: value('category'),
        name: value('item-name'),
        color: value('color') || null,
        material: value('material') || null,
        description: value('description') || null
      },
      location: {
        station: '해운대역',
        place: value('found-place'),
        detail: value('place-detail') || null
      },
      found_at: {
        date: value('found-date'),
        time: value('found-time'),
        timezone: 'Asia/Seoul'
      }
    };
    document.getElementById('summary').textContent =
      payload.item.name + ' · ' + payload.item.category + ' · ' +
      payload.location.place + ' · ' + payload.found_at.date + ' ' + payload.found_at.time;
    result.hidden = false;
    result.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
  document.getElementById('download').addEventListener('click', () => {
    if (!payload) return;
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'haeundae-found-item.json';
    a.click();
    URL.revokeObjectURL(url);
  });
})();
</script>
</body>
</html>
