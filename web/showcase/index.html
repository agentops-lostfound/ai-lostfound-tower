<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>통합 시연</title>
<!--
  통합 시연 화면 (LF-18 · 11/10 변재원) — 발표용, 1920×1080 한 화면 기준
  한줄 설명: 가운데에 실제 키오스크(세로 화면)와 분실인 휴대폰을 띄우고, 그 옆에서 ① 저장소(DB)에 행이 생기고 칸이 바뀌는 모습과
            ② AI 에이전트들이 주고받는 흐름을 같은 순서로 보여 준다.
  - 가운데 틀 안은 실제 화면 그대로다: /kiosk?machine=KIOSK-A(습득) · /phone(분실인 웹) · /kiosk?machine=CENTER(회수)
  - 왼쪽(DB)·오른쪽(에이전트)은 /api/admin/live/state?detail=1 을 0.5초마다 읽어 그린다.
      db 사건    = 저장소에 쓰고 읽은 일(agents/db_watch.py). 이름·연락처·신분 번호·비공개 특징 값은 서버가 보내지 않는다
      trace 사건 = 챗봇·메인 AI 에이전트 한 칸의 시작/끝(agents/observability.py 리스너 — Langfuse 에 남는 것과 같은 단계)
      agent 사건 = 관제탑 에이전트 대화(agents/agent_talk.py)
      vision 사건 = 키오스크 사진 분석(Qwen)의 단계와 결과(agents/vision_watch.py) — 습득 장면의 '사진 분석' 카드. 비공개 값은 개수·상태만 온다
  - 사건이 한꺼번에 와도 하나씩 순서대로 재생한다(밀리면 빨라짐). 처음 열 때 이미 있던 사건은 바로 반영한다
  - 11/10 팀 DB 조회: 가상 시연 기록을 팀 DB 에도 함께 저장할 때(agents/db_mirror.py) /api/admin/db/recent 로 팀 DB 에서 방금 읽은
    최근 접수(어느 등록기계·역, 발견 장소, 사진, 품목, 상태, 보관 칸)를 보여 준다 — "정말 DB 에 들어갔는지"를 화면에서 확인
  - 주소 옵션: ?scene=found|lost|pickup|robot · ?cam=server|demo|browser(키오스크 카메라, 기본은 서버 카메라가 설정돼 있으면 server 아니면 demo)
  색·글자는 공통 디자인(/ui/theme.css)을 쓴다. 화면 지도: web/README.md
-->
<link rel="stylesheet" href="/ui/theme.css?v=20261111a">
<script src="/ui/theme.js"></script>
<style>
:root{
  --ins:var(--ui-ok); --ins-soft:var(--ui-ok-soft); --upd:var(--ui-primary); --upd-soft:var(--ui-primary-soft);
  --del:var(--ui-err); --del-soft:var(--ui-err-soft); --sel:var(--ui-warn); --sel-soft:var(--ui-warn-soft);
  --dev-body:#f4f5f7; --dev-body-2:#e3e6ea; --dev-bezel:#15161a; --dev-ink:#3a414b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ui-bg);color:var(--ui-text);font-family:var(--ui-font);font-size:15px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--ui-mono)}
[hidden]{display:none!important}

/* ---------- 머리말 ---------- */
.bar{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;min-height:56px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--ui-surface);border-bottom:1px solid var(--ui-line);flex:none}
.bar h1{font-size:18px;margin:0;white-space:nowrap;letter-spacing:-.01em}
.bar h1 small{font-weight:600;color:var(--ui-text-3);margin-left:6px;font-size:14px}
.scenes{display:flex;gap:6px;min-width:0;flex-wrap:wrap}
.scenes button{border:0;background:var(--ui-fill);border-radius:999px;padding:8px 14px;font-weight:650;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ui-text-2);min-width:13.5em}   /* 11/12 글자(키오스크 ⇄ 휴대폰 웹)가 바뀌어도 폭 그대로 */
.scenes button:hover{background:var(--ui-fill-hover)}
.scenes button[aria-selected="true"]{background:var(--ui-primary);color:var(--ui-on-primary)}
.scenes button .no{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(127,127,127,.22);font-size:12px;font-weight:700}
.scenes button[aria-selected="true"] .no{background:rgba(255,255,255,.26)}
/* 11/11 ① 탭: 켜진 채로 한 번 더 누르면 중앙역 ⇄ 초량역. 켜져 있을 때만 ⇄ 표시 */
.scenes .swap{display:inline-block;visibility:hidden;margin-left:6px;font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.26)}
.scenes button[aria-selected="true"] .swap{visibility:visible}   /* 11/12 자리는 늘 차지 — 탭을 바꿔도 단추 폭이 그대로 */
.views{display:flex;gap:6px;flex:none}
.views button{border-radius:999px;padding:8px 14px;font-weight:650;white-space:nowrap;text-align:center}
#btnView{min-width:12.5em} #btnRobot{min-width:8.5em}   /* 11/12 글자가 바뀌어도 단추 폭이 그대로 */
.views #btnRobot[aria-pressed="true"]{background:var(--ui-text);color:var(--ui-bg)}
/* 11/12 키오스크만 보기: DB·에이전트 칸만 감춘다. 칸 나눔·진행 막대는 그대로 → 키오스크 위치·크기가 두 보기에서 같음(11/12 오후 검토) */
main > .panel{transition:opacity .2s}
body.kview main > .panel{visibility:hidden;opacity:0}
/* 11/12 오후(2): 키오스크만 보기는 최대한 크게 — 진행 막대·설명 글을 숨기고 받침을 줄여 그만큼 화면을 키움(가운데는 그대로) */
body.kview #steps,body.kview .cap{display:none}
body.kview main{padding-top:10px}
/* 11/12 간단히(기본): 표 이름 줄·두 번째 행 카드를 숨기고 기록은 최근 것만 */
body.simple #tables{display:none}
body.simple:not([data-scene="found"]) .rows{grid-template-columns:minmax(0,1fr)}
body.simple:not([data-scene="found"]) #cardItem{display:none}   /* 분실·회수 장면은 찾기 요청 한 행만 */
body.simple #dbLog > li:nth-child(n+5),body.simple #agLog > li:nth-child(n+4){display:none}
/* 11/12 에이전트 칸: 지금 무슨 일(한 줄 크게) · sLLM 설명 줄 */
.agnow{margin:0 18px 6px;padding:10px 14px;border-radius:12px;background:var(--ui-primary-soft);color:var(--ui-text);font-size:14.5px;line-height:1.5;
  min-height:calc(1.5em * 2 + 20px);box-sizing:border-box;flex:none}
.agnow .k{display:inline-block;margin:0 4px;padding:1px 8px;border-radius:999px;background:var(--ui-surface);font-size:12px;font-weight:700;color:var(--ui-primary)}
.kind.explain{background:var(--ui-ok-soft);color:var(--ui-ok)}
.panel .more{margin-left:auto;font-size:12.5px;padding:4px 10px;border-radius:999px}
.devgo{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap;height:38px;flex:none}   /* 11/12 바로가기 단추가 없는 장면도 자리를 비워 둠 */
.devgo button{border-radius:999px;padding:8px 16px;font-weight:650}
#foundStn{display:inline-block;animation:stn .25s ease-out}
@keyframes stn{from{opacity:0;transform:translateY(-4px)}}
.chips{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--ui-fill);font-size:13px;font-weight:600;color:var(--ui-text-2);white-space:nowrap}
.chip b{color:var(--ui-text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ui-text-3)}
.dot.on{background:var(--ui-ok)} .dot.off{background:var(--ui-err)}
.bar .ghost{border:0;background:var(--ui-fill);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:650;cursor:pointer}
.bar .ghost:hover{background:var(--ui-fill-hover)}
.bar .ghost.armed{background:var(--ui-err);color:#fff}

/* ---------- 이야기 진행 막대 ---------- */
.steps{display:flex;align-items:center;gap:10px;height:44px;box-sizing:border-box;padding-block:6px;flex:none;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.steps .who{font-weight:700;white-space:nowrap}
.steps .who small{color:var(--ui-text-3);font-weight:600;margin-left:6px}
.steps ol{list-style:none;margin:0;padding:0;display:flex;gap:6px;min-width:0;flex-wrap:nowrap;overflow:hidden}
.steps li{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--ui-fill);font-size:13px;font-weight:600;color:var(--ui-text-3);white-space:nowrap}
.steps li::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5}
.steps li.done{background:var(--ui-ok-soft);color:var(--ui-ok)} .steps li.done::before{opacity:1}
.steps li.active{background:var(--ui-primary-soft);color:var(--ui-primary)} .steps li.active::before{opacity:1;animation:pulse 1s infinite}
.steps li.fail{background:var(--ui-err-soft);color:var(--ui-err)} .steps li.skip{text-decoration:line-through}
.steps .result{margin-left:auto;font-size:13px;font-weight:650;color:var(--ui-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.steps .empty{color:var(--ui-text-3);font-size:13.5px}
@keyframes pulse{50%{opacity:.25}}

/* ---------- 본문 3칸 ---------- */
/* 11/12 오후: 키오스크는 늘 화면 가운데 — 왼쪽 DB · 가운데 기기 · 오른쪽 에이전트(키오스크만 보기에서도 같은 자리) */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--devw,400px) minmax(0,1fr);gap:14px;
  padding-block:0 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--ui-surface);border-radius:var(--ui-radius-lg);box-shadow:var(--ui-shadow);min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panel > header{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;flex:none;flex-wrap:wrap}
.panel h2{font-size:17px;margin:0;letter-spacing:-.01em}
.panel h3{font-size:13px;margin:0;color:var(--ui-text-3);font-weight:700;letter-spacing:.02em}
.panel .hint{font-size:12.5px;color:var(--ui-text-3);font-weight:600}
.sub{padding:8px 18px 6px;display:flex;align-items:center;gap:8px;flex:none}
#full{flex:1;min-height:0;border:0;width:100%;background:var(--ui-bg)}

/* ---------- 가운데: 기기(11/12 오후부터, 전에는 왼쪽) ---------- */
#deviceCol{order:2} #panelDb{order:1} #panelAgent{order:3}
.device{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:flex-start;justify-content:center}
/* 11/12 설명 글은 장면마다 1~3줄 → 늘 3줄 높이를 차지(줄 수에 따라 키오스크 크기가 바뀌던 것) */
.cap{flex:none;text-align:center;font-size:12.5px;color:var(--ui-text-3);font-weight:600;line-height:1.45;max-width:100%;
  height:calc(1.45em * 3);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
.cap b{color:var(--ui-text-2)}
/* 세로 키오스크(스탠드형): 검은 테두리 화면 + 밝은 몸체(촬영 카메라 창 · 접수증 나오는 곳 · 옆 단말기) */
.stand{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 18px 28px rgba(0,0,0,.22))}
.k-head{background:var(--dev-bezel);border-radius:22px;padding:10px;position:relative;z-index:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
small.alias{color:var(--ui-text-3,#8b95a1);font-size:.86em;font-weight:500;white-space:nowrap}
.k-screen{position:relative;overflow:hidden;border-radius:14px;background:#fff}
.k-screen iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.k-body{position:relative;margin-top:-14px;padding:22px 9% 8px;border-radius:0 0 18px 18px;
  background:linear-gradient(180deg,var(--dev-body) 0%,var(--dev-body) 62%,var(--dev-body-2) 100%);
  display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:12%;row-gap:4px}
.k-cam{height:58%;min-height:38px;aspect-ratio:1.15;border-radius:8px;background:#1b1d22;display:grid;place-items:center;border:3px solid #2b2e35;grid-row:1 / span 2}
.k-cam i{width:30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#6b7686,#0c0d10 60%)}
.k-slot{height:9px;border-radius:5px;background:#1b1d22;box-shadow:inset 0 2px 3px rgba(0,0,0,.6);align-self:end}
.k-label{font-size:10.5px;font-weight:700;color:var(--dev-ink);letter-spacing:.02em;opacity:.75;align-self:start;text-align:center}
.k-pad{position:absolute;right:-15%;bottom:14%;width:19%;aspect-ratio:.9;border-radius:8px;background:var(--dev-body);
  border:1px solid var(--dev-body-2);transform:rotate(-8deg);display:grid;place-items:center;box-shadow:0 6px 12px rgba(0,0,0,.18)}
.k-pad i{width:62%;aspect-ratio:1.3;border-radius:4px;background:#2b2e35}
/* 분실인 휴대폰 */
.handset{background:var(--dev-bezel);border-radius:44px;padding:11px;filter:drop-shadow(0 18px 28px rgba(0,0,0,.25));box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.handset iframe{display:block;border:0;border-radius:34px;background:#fff}

/* ---------- 왼쪽: DB ---------- */
.tables{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px;flex:none}
.tbl{display:inline-flex;align-items:baseline;gap:5px;padding:3px 8px;border-radius:8px;background:var(--ui-fill);font-size:11.5px;color:var(--ui-text-2);font-weight:600;transition:background .3s}
.tbl code{font-size:11.5px;color:var(--ui-text)} .tbl b{font-variant-numeric:tabular-nums;color:var(--ui-text);font-size:12.5px}
.tbl.zero{display:none} .tbl.hit{background:var(--upd-soft)}
.tables:not(:has(.tbl:not(.zero)))::after{content:"기록이 생긴 표가 여기에 나타나요";font-size:12.5px;color:var(--ui-text-3)}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 4px;flex:none}
.rowcard{border:1.5px solid var(--ui-line);border-radius:14px;padding:10px 12px;min-width:0;transition:border-color .25s, box-shadow .25s}
.rowcard.write{border-color:var(--upd);box-shadow:0 0 0 3px var(--upd-soft)}
.rowcard.read{border-color:var(--sel);box-shadow:0 0 0 3px var(--sel-soft)}
.rowcard h4{margin:0 0 6px;font-size:13.5px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.rowcard h4 code{font-size:13px;padding:1px 6px;border-radius:6px;background:var(--ui-fill)}
.rowcard h4 .pk{margin-left:auto;font-family:var(--ui-mono);font-size:12px;color:var(--ui-primary);font-weight:700}
.rowcard dl{margin:0;display:grid;grid-template-columns:minmax(0,46%) minmax(0,1fr);row-gap:1px;column-gap:8px;font-size:12.5px}
.rowcard dt{color:var(--ui-text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
.rowcard dt code{color:var(--ui-text-2);font-size:11.5px}
.rowcard dd{margin:0;padding:2px 5px;border-radius:6px;font-weight:600;overflow-wrap:anywhere;min-width:0;transition:background .8s}
.rowcard dd.none{color:var(--ui-text-3);font-weight:500}
.rowcard dd.locked{color:var(--ui-text-3);font-weight:500;font-size:12px}
.rowcard dd.flash{background:var(--upd-soft);color:var(--upd);transition:none}
.log{list-style:none;margin:0;padding:0 18px 16px;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.log:empty{display:none}
/* 11/11 빈 화면 안내: 기록이 생기기 전에는 이 장면의 순서를 미리 보여 주고, 첫 기록이 생기면 사라진다 */
.log:not(:empty)+.guide{display:none}
.guide{flex:1;min-height:0;overflow:auto;padding:4px 18px 16px;display:flex;flex-direction:column;gap:10px}
.guide .gh{font-size:13.5px;color:var(--ui-text-2);font-weight:700}
.guide ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:g}
.guide li{counter-increment:g;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:12px;
  border:1.5px dashed var(--ui-line);color:var(--ui-text-2);font-size:14px;line-height:1.5}
.guide li::before{content:counter(g);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ui-surface-2);
  color:var(--ui-text-2);font:700 13px var(--ui-mono)}
.guide li b{color:var(--ui-text);font-weight:700}
.guide li .op{margin-right:4px}
.guide .gf{font-size:12.5px;color:var(--ui-text-3)}
.guide .chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.guide .chain span{padding:8px 12px;border-radius:10px;border:1.5px dashed var(--ui-line);font-size:14px;font-weight:600;color:var(--ui-text-2)}
.guide .chain i{font-style:normal;color:var(--ui-text-3)}
.newest{margin-left:auto;border:0;border-radius:999px;padding:4px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
  background:var(--ui-primary);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.ev.fresh{box-shadow:0 0 0 2px var(--ui-primary) inset}
.dbtable td.feat small{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:3px;color:var(--ui-text-2);font-size:11.5px}
.dbtable td.feat small b{color:var(--ui-text)} .dbtable td.feat small.pre{color:var(--ui-text-3)}
.dbtable .sw{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.ev{border-radius:12px;background:var(--ui-surface-2);padding:9px 11px;border-left:4px solid var(--ui-line);animation:drop .28s ease-out;min-width:0}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
.ev.INSERT{border-left-color:var(--ins)} .ev.UPDATE{border-left-color:var(--upd)} .ev.DELETE{border-left-color:var(--del)} .ev.SELECT{border-left-color:var(--sel)}
.ev .top{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-size:13px}
.op{font-family:var(--ui-mono);font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;letter-spacing:.02em}
.op.INSERT{background:var(--ins-soft);color:var(--ins)} .op.UPDATE{background:var(--upd-soft);color:var(--upd)}
.op.DELETE{background:var(--del-soft);color:var(--del)} .op.SELECT{background:var(--sel-soft);color:var(--sel)}
.ev .top code{font-size:12.5px;font-weight:700}
.ev .top .easy{color:var(--ui-text-2);font-weight:600}

      if (!tower) { chatPrev = node; if (node === "reporter") chatReported = true; }
      else if (live && node !== "메인 AI") packet("tower", node, "메인 AI");
      agLine(`<div class="top"><span class="kind${t.error ? " err" : ""}">${esc(node)}</span><span class="who">${esc(roleOf(gname, node))}</span><span class="t">${fmtMs(t.ms || 0)}</span></div>` +
        `<p>${esc(t.error ? t.error : draft(node, short(t.output)))}</p>`);
    }
  }
  // 일꾼(researcher 등)이 만든 글은 아직 '초안'이다 — 화면에 나가는 답은 reporter 가 정리한 것 하나뿐이라는 점이 보이게
  const draft = (node, text) => node === "reporter" ? text : text.replace(/(^|· )answer: /, "$1답 초안(reporter 가 정리하기 전): ");
  const roleOf = (gname, node) => (G[gname].nodes[node] || [])[2] || "";
  const short = (out) => String(out || "").slice(0, 260);      // 서버(observability.brief)가 이미 가리고 줄인 한 줄

  // ================= 이야기 진행 막대 =================
  let stories = [];
  // 11/13 로봇 작업대를 보는 중에 로봇이 제출보관함에 물건을 놓으면(제출보관함 전달 끝 · 인계 전) 스스로 키오스크로 돌아와
  // [물건 받았어요] 화면이 보이게 한다 — 전에는 발표자가 [← 키오스크로]를 눌러야 인계 화면이 보였다. 이야기마다 한 번, 바뀌는 순간에만
  const waitSeen = {};
  function backToKiosk() {
    const st = stories.find((s) => s.kind === "lost");
    if (!st) return;
    const now = handoverWait(st), before = waitSeen[st.story_id];
    waitSeen[st.story_id] = now;
    if (!now || before !== false || !robotOpen) return;      // 처음 볼 때 이미 기다리는 중이면(새로고침) 건드리지 않음
    setTimeout(() => { if (!robotOpen) return; if (SCENES[scene].head !== "pickup") setScene("pickup"); else setRobot(false); }, 2500);
  }
  function renderSteps() {
    backToKiosk();
    const want = (SCENES[scene] || {}).kind;
    const st = stories.find((s) => s.kind === want);
    const box = $("steps");
    if (!st) { box.innerHTML = `<span class="empty">${want === "lost" ? "아직 분실 신고·회수 건이 없어요 — ② 분실 신고에서 찾기 번호를 받은 뒤 ③ 회수에서 입력해 보세요." : "아직 진행 중인 건이 없어요 — 가운데 키오스크에서 시작해 보세요."}</span>`; return; }
    const ids = Object.values(st.ids || {}).filter(Boolean).join(" · ");
    box.innerHTML = `<span class="who">${st.kind === "found" ? "습득" : "분실·반환"} ${esc(st.story_id)}<small>${esc(ids)}</small></span><ol>` +
      st.stages.map((s) => `<li class="${esc(s.state)}" title="${esc(s.detail || "")}">${esc(s.label)}</li>`).join("") + `</ol>` +
      (st.result ? `<span class="result">${st.result.ok ? "✅" : "⚠️"} ${esc(st.result.text)}${handoverWait(st) ? ` · <a href="/staff" target="_blank" rel="noopener" title="직원 화면에서 실물·신분증·확인 질문을 교차 검증하면 인계 완료로 바뀌어요">직원 화면 열기</a>` : ""}</span>` : "");
  }
  // 11/10 사람 조작 점검: 제출보관함까지 끝난 뒤 발표 화면에서 다음 할 일(직원 교차 검증)로 바로 갈 길이 없었다
  function handoverWait(st) {
    if (st.kind !== "lost") return false;
    const g = Object.fromEntries((st.stages || []).map((s) => [s.label, s.state]));
    return g["제출보관함 전달"] === "done" && g["인계 완료"] !== "done";
  }

  // ================= 읽기 · 순서대로 재생 =================
  let seq = 0, first = true, fails = 0, pollTimer = null;
  // 틀 안의 챗봇 창이 "질문을 보냈다"고 알리면(web/chat-widget/widget.js) 기다리지 않고 챗봇 그림으로 바꾸고 바로 읽는다
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin || !e.data || e.data.source !== "lostfound-chat" || e.data.phase !== "ask") return;
    chatSince = Date.now(); holdUntil = 0; showGraph("chat");
    clearTimeout(pollTimer); pollTimer = setTimeout(poll, 60);
  });
  const queue = [];
  function handle(e, live) {
    if (e.channel === "db") { applyDb(e.db, live); logDb(e); }
    else if (e.channel === "agent") applyAgent(e, live);
    else if (e.channel === "trace") applyTrace(e, live);
    else if (e.channel === "vision") applyVision(e, live);
  }
  // 재생 속도: 사건을 하나씩 보여 주되 **실제보다 늦어지지 않게** 밀린 시간(받은 뒤 기다린 시간)에 맞춰 빨라진다(11/10).
  // 전에는 사건마다 0.38초씩 쉬어, 챗봇 답이 이미 화면에 나왔는데 그림은 아직 researcher 에 있는 것처럼 보였다
  function pump() {
    const e = queue.shift();
    if (e) handle(e, true);
    const n = queue.length, late = n ? Date.now() - (queue[0]._at || Date.now()) : 0;
    // _rush: 이미 끝난 챗봇 질문의 남은 단계 — 답이 벌써 사용자 화면에 나갔으니 그림도 곧바로 '답'까지 간다
    // 11/12 관제탑 에이전트 말은 하나씩 1.6초(읽을 시간) — 정말 많이 밀렸을 때(40개↑)만 0.4초. 다른 기록은 예전 속도
    const agentNext = n && queue[0].channel === "agent", agentNow = e && e.channel === "agent";
    setTimeout(pump, !n ? 60 : queue[0]._rush ? 15 : (agentNow || agentNext) ? (n > 40 ? 400 : 1600)
      : (n > 60 || late > 4000) ? 20 : (n > 25 || late > 2000) ? 60 : (n > 8 || late > 900) ? 130 : 280);
  }
  let moreNow = false;                    // 받을 기록이 더 남았으면 곧바로 다시 부른다
  async function poll() {
    try {
      const r = await fetch(`/api/admin/live/state?after=${seq}&detail=1`, {cache: "no-store"});
      if (r.status === 401) { banner(`관리자 로그인이 켜져 있어요 — <a href="/admin">관리자 화면</a>에서 로그인한 뒤 이 화면을 다시 열어 주세요.`); throw new Error(401); }
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      fails = 0; if (Date.now() > noteUntil) banner("");   // 11/12 기본 세팅 거절 안내는 8초 동안 남김
      $("conn").className = "dot on"; $("connText").textContent = d.busy ? "연결됨 · 반환 진행 중" : "연결됨";
      showMirror(d);
      $("lf").textContent = d.langfuse ? "기록 중" : "꺼짐";
      $("btnReset").hidden = !d.sim || !!d.robot_control;
      $("robotMode").hidden = !d.robot_control;
      const w = d.qwen_worker || {on: false};
      if (w.on !== worker.on) { worker = w; drawVision(false); } else worker = w;
      const evs = (d.events || []).filter((e) => e.channel === "db" || e.channel === "agent" || e.channel === "trace" || e.channel === "vision");
      if (first) { evs.forEach((e) => handle(e, false)); if (!d.more) { first = false; drawGraph(); } }   // 처음 열 때 쌓인 기록이 200개를 넘으면 끝까지 이어 받은 뒤 그린다
      else {
        const at = Date.now(); evs.forEach((e) => { e._at = at; }); queue.push(...evs);
        const isChat = (e) => e.channel === "trace" && e.trace && e.trace.trace_name !== "tower-main-ai";
        const end = queue.findLastIndex((e) => isChat(e) && e.trace.kind === "trace_end");
        if (end >= 0) for (let i = 0; i <= end; i++) if (isChat(queue[i])) queue[i]._rush = true;
      }
      stories = d.stories || []; renderSteps();
      const oc = Object.fromEntries((d.claims_open || []).map((o) => [o.claim_id, o]));
      const modeChanged = realRobotMode !== !!d.robot_control;
      realRobotMode = !!d.robot_control;
      if (modeChanged || JSON.stringify(oc) !== JSON.stringify(openClaims)) { openClaims = oc; drawClaimActs(); }
      seq = d.seq; moreNow = !!d.more;
    } catch (e) {
      fails++;
      if (fails > 2) { $("conn").className = "dot off"; $("connText").textContent = "관제탑 연결 끊김"; }
    }
    clearTimeout(pollTimer);
    pollTimer = setTimeout(poll, moreNow ? 30 : chatSince && Date.now() - chatSince < CHAT_BUSY_MAX_MS ? 120 : 500);        // 챗봇 질문이 진행 중이면 더 자주 읽는다(답과 그림이 같은 때에 끝나게)
  }
  function banner(html) { const b = $("banner"); b.hidden = !html; if (html) b.innerHTML = html; }

  // 처음으로(가상 세계 초기화)·보관함 채우기(11/12 실물 배치 8칸): 실수로 누르지 않게 두 번 눌러야 실행
  let armed = null, robotControl = false, noteUntil = 0;
  const twoPress = (id, label, ask, body) => async () => {
    const b = $(id);
    if (armed !== id) { if (armed) return; armed = id; b.classList.add("armed"); b.textContent = ask;
      setTimeout(() => { if (armed === id) { armed = null; b.classList.remove("armed"); b.textContent = label; } }, 4000); return; }
    armed = null; b.classList.remove("armed"); b.textContent = label;
    await resetWorld(body());
  };
  $("btnReset").onclick = twoPress("btnReset", "처음으로", "한 번 더 누르면 초기화", () => ({}));
  // 11/12 [📦 기본 세팅]은 로봇 작업대 맨 아래 '기록 삭제' 상자로 옮김(/live)
  async function resetWorld(body) {
    try {
      const r = await fetch("/sim/reset", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      if (!r.ok) { const d = await r.json().catch(() => ({})); const m = typeof d.detail === "string" ? d.detail : d.detail && d.detail.message;
        noteUntil = Date.now() + 8000; banner("⚠️ " + esc(m || "초기화하지 못했어요(반환이 진행 중이면 끝난 뒤 다시)")); return; }
      dbSaved.clear(); dbSeen = null;
      for (const t of ["item", "claim"]) { rows[t] = {}; cur[t] = null; drawCard(t); }
      for (const k of Object.keys(vis)) delete vis[k]; visCur = null; drawVision(false);
      $("dbLog").innerHTML = ""; $("agLog").innerHTML = ""; state.tower = {}; state.chat = {}; lastDb = null; drawGraph();
      for (const id of ["fFound", "fPickup", "fLost"]) { const f = $(id); if (f.getAttribute("src")) f.src = f.getAttribute("src"); }
    } catch (_) { banner("관제탑에 연결할 수 없어요"); }
  };

  // ================= 시작 =================
  async function start() {
    if (!camMode) {                               // 서버 카메라가 설정된 기계면 server, 아니면 가상 카메라(자동 촬영)
      try { const d = await (await fetch("/api/kiosk/cameras", {cache: "no-store"})).json(); camMachines = d.machines || {};
        camMode = Object.keys(camMachines).some((m) => m !== "CENTER") ? "server" : "demo"; }
      catch (_) { camMode = "demo"; }
    } else if (camMode === "server") {
      try { camMachines = (await (await fetch("/api/kiosk/cameras", {cache: "no-store"})).json()).machines || {}; } catch (_) {}
    }
    $("foundStn").textContent = FOUND_STN[foundMachine];
    drawCard("item"); drawCard("claim"); drawVision(false); drawGraph();
    if (qs.get("view") === "kiosk") document.body.classList.add("kview"), $("btnView").setAttribute("aria-pressed", "true"), $("btnView").textContent = "📊 DB·에이전트 함께 보기";
    const openRobot = robotOpen;
    setScene(scene);
    if (openRobot) setRobot(true);
    poll(); pump();
  }
  start();
})();
</script>
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="찍힌 사진 크게 보기">
  <button type="button" id="lbClose" aria-label="닫기">✕</button>
  <figure><img id="lbImg" alt="찍힌 사진"><figcaption id="lbCap"></figcaption></figure>
</div>
<script>
(function () {   // 11/11 작은 사진(팀 DB 조회 표 · 사진 분석 카드)을 누르면 이 창 안에서 크게
  const box = document.getElementById("lightbox"), img = document.getElementById("lbImg"), cap = document.getElementById("lbCap");
  let back = null;
  function open(src, label) { back = document.activeElement; img.src = src; cap.textContent = label || ""; box.hidden = false; document.getElementById("lbClose").focus(); }
  function close() { box.hidden = true; img.removeAttribute("src"); if (back && back.focus) back.focus(); }
  document.addEventListener("click", (e) => {
    const t = e.target.closest && e.target.closest(".dbtable img.ph, .vhead img");
    if (t && !box.contains(t)) {
      const m = /items\/([^/]+)\/photo/.exec(t.getAttribute("src") || "");
      open(t.src, m ? decodeURIComponent(m[1]) : "");
      return;
    }
    if (!box.hidden && (e.target === box || e.target.id === "lbClose" || e.target === img)) close();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !box.hidden) close(); });
})();
</script>
</body>
</html>
