<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
  <title>습득물 등록 | AI 분실물 관제탑</title>
  <link rel="stylesheet" href="/ui/theme.css">
  <script src="/ui/theme.js"></script>
  <style>
    /* 11/8 디자인 개편: 공통 토큰(/ui/theme.css 의 --ui-*)만 사용 — 회색 바탕 위 흰 카드, 파란 주 버튼, 라이트·다크 전환.
       id·class 이름과 JS 는 그대로 두고 모양만 다시 입혔다 */
    :root{font-synthesis:none}
    *{box-sizing:border-box}
    body{margin:0;padding:28px 16px 40px;background:var(--ui-bg);color:var(--ui-text);font:500 16px/1.5 var(--ui-font);word-break:keep-all;overflow-wrap:break-word}
    .wrap{max-width:980px;margin:auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .topbar .ui-theme-toggle{width:48px;height:48px;background:var(--ui-surface);box-shadow:var(--ui-shadow)}
    .topbar .ui-theme-toggle:hover{background:var(--ui-surface-2)}
    .eyebrow{display:flex;align-items:center;gap:10px;color:var(--ui-primary);font-weight:700;letter-spacing:.02em;font-size:15px}
    .step{width:32px;height:32px;border-radius:50%;background:var(--ui-primary);color:var(--ui-on-primary);display:grid;place-items:center;letter-spacing:0;font-size:15px}
    h1{font-size:clamp(30px,5vw,44px);line-height:1.2;letter-spacing:-.03em;margin:24px 0 10px;font-weight:700;text-wrap:balance}
    .intro{color:var(--ui-text-2);margin:0 0 28px;font-size:17px}
    .layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(250px,.8fr);gap:20px;align-items:start}
    form,.preview-card,.success{background:var(--ui-surface);border:0;border-radius:var(--ui-radius-lg);padding:28px;box-shadow:var(--ui-shadow)}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
    .section-head small{display:block;color:var(--ui-text-3);font-weight:600;font-size:13px}
    h2{font-size:22px;margin:4px 0 0;font-weight:700;letter-spacing:-.02em}
    .required{display:inline-flex;align-items:center;background:var(--ui-err-soft);color:var(--ui-err);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
    .field-group{margin:24px 0}.field-group label{display:block;font-weight:700;font-size:15px;margin-bottom:10px}
    .field-group label > span:not(.required):not(.upload-content){color:var(--ui-text-3);font-weight:600;font-size:13px}
    input,select,textarea{width:100%;min-height:56px;border:1.5px solid transparent;border-radius:var(--ui-radius);padding:0 16px;font:inherit;font-size:16px;color:var(--ui-text);background:var(--ui-fill);outline:none;transition:border-color .15s,background-color .15s}
    input::placeholder,textarea::placeholder{color:var(--ui-text-3)}
    input:focus,select:focus,textarea:focus{border-color:var(--ui-primary);background:var(--ui-surface)}
    textarea{min-height:96px;padding:14px 16px;resize:vertical}.hint{font-size:13px;color:var(--ui-text-3);line-height:1.6;margin:8px 0 0}
    .upload{min-height:190px;border:2px dashed var(--ui-line);border-radius:var(--ui-radius);background:var(--ui-surface-2);display:grid;place-items:center;text-align:center;overflow:hidden;cursor:pointer;transition:border-color .15s,background-color .15s}
    .upload:hover{border-color:var(--ui-primary);background:var(--ui-primary-soft)}
    .field-group label.upload{margin-bottom:0;font-weight:500}
    .upload img{max-width:100%;max-height:260px;object-fit:contain}.upload-content{padding:24px;color:var(--ui-text)}.camera{font-size:36px}
    .upload-content strong{display:inline-block;margin-top:6px;font-size:16px}
    .quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ui-text-3)}
    .quick button,.secondary{min-height:44px;background:var(--ui-fill);border:0;color:var(--ui-text);border-radius:999px;padding:0 16px;font:600 15px var(--ui-font);cursor:pointer;transition:background-color .15s}
    .quick button:hover,.secondary:hover{background:var(--ui-fill-hover)}
    .quick button[aria-pressed="true"]{background:var(--ui-primary);color:var(--ui-on-primary)}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .two label{font-weight:600;font-size:13px;color:var(--ui-text-2);margin-bottom:6px}
    .consent{display:flex;gap:10px;align-items:flex-start;color:var(--ui-text-2);font-size:13px;line-height:1.6;margin:24px 0;padding:16px;background:var(--ui-surface-2);border-radius:var(--ui-radius);cursor:pointer}
    .consent input{width:20px;height:20px;min-height:0;flex:none;margin:1px 0 0;padding:0;accent-color:var(--ui-primary)}
    .submit{width:100%;min-height:58px;border:0;border-radius:var(--ui-radius);background:var(--ui-primary);color:var(--ui-on-primary);padding:0 16px;font:700 17px var(--ui-font);cursor:pointer;transition:background-color .15s,transform .08s}
    .submit:hover{background:var(--ui-primary-hover)}.submit:active{transform:scale(.98)}
    .submit:disabled{background:var(--ui-fill);color:var(--ui-text-3);cursor:default;transform:none}
    .preview-card{padding:20px;position:sticky;top:18px}
    .device{height:260px;border-radius:var(--ui-radius);background:var(--ui-fill);position:relative;overflow:hidden;display:grid;place-items:center;color:var(--ui-text-3);text-align:center}
    .device:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ui-primary)}
    .device strong{color:var(--ui-text);display:inline-block;margin-top:6px}
    .device .placeholder{font-size:42px}.device img{max-width:100%;max-height:100%;object-fit:contain}
    .status{display:block;margin:16px auto 4px;background:var(--ui-primary-soft);color:var(--ui-primary);border-radius:var(--ui-radius);padding:14px;text-align:center;font-weight:700}
    .preview-card p{text-align:center;font-size:13px;color:var(--ui-text-3);line-height:1.6;margin:10px 0 0}
    .success{margin-top:20px}.success[hidden]{display:none}
    .success h2{font-size:22px}
    .ticket{background:var(--ui-primary-soft);border:0;border-radius:var(--ui-radius);padding:20px;text-align:center;margin:16px 0}
    .ticket strong{display:block;font-size:30px;font-weight:800;color:var(--ui-primary);letter-spacing:.02em;margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
    #receipt-summary{color:var(--ui-text-2)}
    .actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{flex:1}
    .notice{font-size:13px;color:var(--ui-text-2);background:var(--ui-fill);border-radius:var(--ui-radius-sm);padding:14px;line-height:1.65;margin-top:14px}
    .footer{text-align:center;margin:24px 0 0}
    /* 11/8 디자인 개편 2: 글 대신 그림 안내(인라인 SVG 선 그림, 글자색 currentColor + 파랑 var(--ui-primary)). 화면 읽기 프로그램은 <title> 을 읽는다 */
    .pic{display:block;flex:none;color:var(--ui-text-2);fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .pic .p{stroke:var(--ui-primary)}.pic .pf{fill:var(--ui-primary);stroke:none}.pic text{font-family:var(--ui-font);font-weight:800}
    .flow{display:flex;align-items:center;gap:8px;margin:0 0 28px;padding:0;list-style:none}
    .flow li{flex:1;display:flex;align-items:center;gap:12px;background:var(--ui-surface);border-radius:var(--ui-radius);padding:12px 16px;box-shadow:var(--ui-shadow);font-weight:700;font-size:17px;min-width:0}
    .flow li.arrow{flex:none;background:none;box-shadow:none;padding:0;color:var(--ui-text-3)}
    .flow .pic{width:44px;height:44px}
    .flow .arrow .pic{width:20px;height:20px;color:var(--ui-text-3)}
    .flow small{display:block;font-size:13px;font-weight:600;color:var(--ui-text-3)}
    .upload-content .pic{width:64px;height:64px;margin:0 auto 4px;color:var(--ui-primary)}
    .device-icon{width:72px;height:72px;margin:0 auto 4px}
    .done-icon{width:28px;height:28px;display:inline-block;vertical-align:-6px;margin-right:6px}
    .topbar .ui-theme-toggle{width:56px;height:56px}
    .quick button{min-height:56px;padding:0 18px}
    @media(max-width:720px){.flow{gap:4px}.flow li{flex-direction:column;gap:4px;padding:10px 4px;text-align:center;font-size:14px}.flow .pic{width:36px;height:36px}.flow small{font-size:11px}.flow .arrow .pic{width:14px;height:14px}}
    @media(max-width:720px){body{padding:16px 12px 32px}.layout{grid-template-columns:1fr}.preview-card{position:static;grid-row:1}form{padding:20px}.device{height:200px}}
    @media(max-width:420px){.two{grid-template-columns:1fr}.section-head{align-items:flex-start}}
  </style>
</head>
<body>
<main class="wrap">
  <div class="topbar"><div class="eyebrow"><span class="step">1</span> 습득물 등록기계 · 무인</div><span data-theme-slot></span></div>
  <h1>장소만 고르고, 넣으면 끝</h1>
  <ol class="flow" aria-label="접수 순서">
    <li><svg class="pic" viewBox="0 0 48 48" role="img"><title>사진 찍기</title><rect x="5" y="13" width="38" height="28" rx="5"/><path d="M17 13l3-5h8l3 5"/><circle class="p" cx="24" cy="27" r="7"/></svg><span>사진<small>찍기·고르기</small></span></li>
    <li class="arrow" aria-hidden="true"><svg class="pic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></li>
    <li><svg class="pic" viewBox="0 0 48 48" role="img"><title>장소 고르기</title><path d="M24 44S10 31 10 20a14 14 0 0 1 28 0c0 11-14 24-14 24z"/><circle class="p" cx="24" cy="20" r="5"/></svg><span>장소<small>누르거나 쓰기</small></span></li>
    <li class="arrow" aria-hidden="true"><svg class="pic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></li>
    <li><svg class="pic" viewBox="0 0 48 48" role="img"><title>접수 번호 받기</title><path d="M4 12h40v8a4 4 0 0 0 0 8v8H4v-8a4 4 0 0 0 0-8z"/><path class="p" d="M13 24h14M33 12v24" /></svg><span>접수 번호<small>받으면 끝</small></span></li>
  </ol>

  <div class="layout">
    <form id="intake-form">
      <div class="section-head">
        <div><h2>습득물 등록</h2></div>
      </div>

      <div class="field-group">
        <label for="photo">① 사진 <span class="required">필수</span></label>
        <label class="upload" for="photo">
          <span class="upload-content" id="upload-prompt"><svg class="pic" viewBox="0 0 48 48" role="img"><title>사진 찍기</title><rect x="5" y="13" width="38" height="28" rx="5"/><path d="M17 13l3-5h8l3 5"/><circle cx="24" cy="27" r="7"/><path d="M38 6v8M34 10h8"/></svg><strong>눌러서 사진 찍기</strong><br><span class="hint">또는 파일 고르기</span></span>
          <img id="photo-preview" alt="선택한 습득물 사진 미리보기" hidden>
        </label>
        <input id="photo" name="photo" type="file" accept="image/*" capture="environment" required hidden>
        <p class="hint" id="photo-name">사진 파일 1장을 선택해 주세요.</p>
      </div>

      <div class="field-group">
        <label for="location">② 발견 장소 <span class="required">필수</span></label>
        <input id="location" name="location" maxlength="200" placeholder="예: 2호선 해운대역 남자 화장실 안" required>
        <div class="quick" aria-label="관제탑 추천 장소"></div>
      </div>

      <div class="field-group">
        <label>③ 연락처 <span>선택</span></label>
        <div class="two">
          <div><label for="finder-name">이름</label><input id="finder-name" name="finder_name" maxlength="40" autocomplete="name" placeholder="이름 입력"></div>
          <div><label for="finder-phone">전화번호</label><input id="finder-phone" name="finder_phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="010-0000-0000"></div>
        </div>
        <p class="hint">안 적어도 접수돼요.</p>
      </div>

      <label class="consent"><input id="consent" type="checkbox" required><span>반환 안내용 개인정보 이용에 동의해요.<br>(시연용 문구 · 운영 때 정식 동의문으로 교체)</span></label>
      <button class="submit" type="submit">습득물 접수하기 →</button>
    </form>

    <aside class="preview-card" aria-label="접수 상태 미리보기">
      <div class="device" id="device-preview">
        <div id="device-placeholder"><svg class="pic device-icon" viewBox="0 0 48 48" role="img"><title>사진 미리보기 자리</title><rect x="6" y="9" width="36" height="30" rx="4"/><circle class="p" cx="17" cy="19" r="3.5"/><path class="p" d="M6 33l11-10 9 8 6-5 10 9"/></svg><strong>사진이 여기 보여요</strong></div>
      </div>
      <span class="status" id="status">접수 대기 중</span>
      <p>사진·장소를 넣으면 접수 번호가 나와요</p>
    </aside>
  </div>

  <section class="success" id="success" aria-live="polite" hidden>
    <h2><svg class="pic done-icon" viewBox="0 0 28 28" role="img"><title>완료</title><circle class="p" cx="14" cy="14" r="12"/><path class="p" stroke-width="3" d="M8 14.5l4 4 8-9"/></svg>습득물 접수 완료</h2>
    <div class="ticket"><span class="hint">접수 번호</span><strong id="receipt-number">#A-0000</strong></div>
    <div id="receipt-summary"></div>
    <p class="notice">번호를 확인해 주세요 · 10초 뒤 처음으로</p>
  </section>
  <p class="hint footer">AI LOST &amp; FOUND · 습득물 등록 서비스</p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const form = $('intake-form');
  const machine = new URLSearchParams(location.search).get('machine') || 'KIOSK-A';
  let selectedPhotoData = null, chosenPlaceId = null, resetTimer = null;
  async function loadPlaces() {
    const chips = document.querySelector('.quick'); chips.replaceChildren();
    try {
      const res = await fetch('/api/kiosk/places?machine_id=' + encodeURIComponent(machine));
      if (!res.ok) throw new Error();
      const places = await res.json();
      places.forEach(place => {
        const button = document.createElement('button'); button.type='button'; button.textContent=place.label;
        button.addEventListener('click', () => {
          chosenPlaceId=place.place_id; $('location').value=place.label;
          chips.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
        });
        chips.appendChild(button);
      });
      if (!places.length) chips.textContent='추천 장소가 없습니다. 장소를 직접 입력해 주세요.';
    } catch { chips.textContent='추천 장소를 불러오지 못했습니다. 장소를 직접 입력해 주세요.'; }
  }
  $('photo').addEventListener('change', () => {
    const file=$('photo').files && $('photo').files[0]; if(!file)return;
    if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){
      alert('JPG, PNG 또는 WEBP 사진을 5MB 이하로 선택해 주세요.'); $('photo').value=''; selectedPhotoData=null; return;
    }
    const reader=new FileReader();
    reader.onload=()=>{
      selectedPhotoData=reader.result; $('photo-preview').src=selectedPhotoData; $('photo-preview').hidden=false;
      $('upload-prompt').hidden=true; $('device-placeholder').hidden=true;
      const img=document.createElement('img'); img.src=selectedPhotoData; img.alt='등록할 습득물';
      const old=$('device-preview').querySelector('img'); if(old)old.remove(); $('device-preview').appendChild(img);
      $('photo-name').textContent=file.name+' · '+Math.round(file.size/1024)+' KB';
    }; reader.readAsDataURL(file);
  });
  $('finder-phone').addEventListener('input',event=>{
    let d=event.target.value.replace(/\D/g,'').slice(0,11);
    if(d.length>7)d=d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7); else if(d.length>3)d=d.slice(0,3)+'-'+d.slice(3);
    event.target.value=d;
  });
  function resetScreen(){
    clearTimeout(resetTimer); form.reset(); selectedPhotoData=null; chosenPlaceId=null;
    $('photo-preview').hidden=true; $('photo-preview').removeAttribute('src'); $('upload-prompt').hidden=false;
    $('photo-name').textContent='사진 파일 1장을 선택해 주세요.';
    $('device-preview').querySelectorAll('img').forEach(img=>img.remove()); $('device-placeholder').hidden=false;
    $('success').hidden=true; $('status').textContent='접수 대기 중'; $('receipt-summary').replaceChildren();
    $('receipt-number').textContent=''; window.scrollTo({top:0,behavior:'smooth'}); loadPlaces();
  }
  form.addEventListener('submit',async event=>{
    event.preventDefault(); if(!form.reportValidity())return;
    if(!selectedPhotoData){alert('습득물 사진을 먼저 등록해 주세요.');$('photo').focus();return;}
    const placeText=$('location').value.trim();
    if(!placeText){alert('발견 장소를 입력하거나 추천 장소를 선택해 주세요.');$('location').focus();return;}
    const body={machine_id:machine,place_text:placeText,photo:selectedPhotoData};
    if(chosenPlaceId!==null&&chosenPlaceId!==undefined)body.place_id=chosenPlaceId;
    const name=$('finder-name').value.trim(),phone=$('finder-phone').value.trim();
    if(name||phone)body.finder={name:name||null,phone:phone||null};
    const submit=form.querySelector('.submit'); submit.disabled=true; submit.textContent='접수 중…';
    try{
      const res=await fetch('/api/kiosk/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const data=await res.json();
      if(!res.ok){const detail=typeof data.detail==='string'?data.detail:JSON.stringify(data.detail||data);
        throw new Error(res.status===422?detail:'접수 서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.');}
      $('receipt-number').textContent='#'+data.item_id;
      $('receipt-summary').textContent='발견 장소: '+(data.place_text||placeText);
      $('status').textContent='접수 완료 · '+data.item_id; $('success').hidden=false;
      $('success').scrollIntoView({behavior:'smooth',block:'nearest'}); resetTimer=setTimeout(resetScreen,10000);
    }catch(error){alert(error.message||'접수 중 오류가 발생했습니다.');}
    finally{submit.disabled=false;submit.textContent='습득물 접수하기 →';}
  });
  loadPlaces();
})();
</script>
</body>
</html>
