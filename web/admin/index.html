<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 관제 | AI 분실물 관제탑</title>
<link rel="stylesheet" href="/ui/theme.css?v=20261111a">
<script src="/ui/theme.js"></script>
<style>
/* 11/8 디자인 개편: 색은 공통 토큰(--ui-*). 머리말의 전환 버튼 하나로 안쪽 화면(iframe)까지 라이트·다크가 함께 바뀐다(theme.js storage 이벤트) */
:root{--bg:var(--ui-bg);--ink:var(--ui-text);--muted:var(--ui-text-2);--line:var(--ui-line);--accent:var(--ui-primary);--warn:var(--ui-err);--warn-bg:var(--ui-err-soft)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--ui-font);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));
  background:var(--ui-surface);box-shadow:0 1px 0 var(--line);position:relative;z-index:2}
header h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1;white-space:nowrap;display:flex;align-items:center;gap:8px}
header h1::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--ui-primary-soft)}
#who{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
#who[hidden]{display:none}
[data-theme-slot]{display:inline-flex}
button{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:12px;min-height:40px;padding:0 16px;cursor:pointer;background:var(--accent);color:var(--ui-on-primary);
  transition:background-color .15s,transform .08s}
button:hover{background:var(--ui-primary-hover)}
button:active{transform:scale(.98)}
button.ghost{background:var(--ui-fill);color:var(--ink)}
button.ghost:hover{background:var(--ui-fill-hover)}
button.tab{background:transparent;color:var(--muted)}
button.tab:hover{background:var(--ui-fill);color:var(--ink)}
button.tab.on{background:var(--ui-primary-soft);color:var(--accent);font-weight:700}
#logout{margin-left:4px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#login{margin:auto;width:min(380px,calc(100% - 32px));background:var(--ui-surface);border-radius:var(--ui-radius-lg);box-shadow:var(--ui-shadow);padding:32px 28px;display:none}
#login h2{margin:0 0 6px;font-size:24px;font-weight:700;letter-spacing:-.02em}
#login p{margin:0 0 20px;color:var(--muted)}
#login button[type=submit]{min-height:52px;font-size:16px;border-radius:var(--ui-radius)}
input[type=password]{width:100%;font:inherit;min-height:52px;padding:0 16px;border:1.5px solid transparent;border-radius:var(--ui-radius);margin-bottom:12px;
  background:var(--ui-fill);color:var(--ink);outline:none}
input[type=password]::placeholder{color:var(--ui-text-3)}
input[type=password]:focus{border-color:var(--accent);background:var(--ui-surface)}
#err{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700;display:none}
#err.on{display:block}
#app{flex:1;display:none;flex-direction:column;min-height:0}
#app.on{display:flex}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
/* 11/8 그림 안내: 탭 아이콘·로그인 자물쇠(선 그림, currentColor) */
button.tab{display:inline-flex;align-items:center;gap:6px}
button.tab[hidden]{display:none}
button.tab svg,button[data-chatbot-open] svg{width:18px;height:18px;flex:none}
button[data-chatbot-open]{display:inline-flex;align-items:center;gap:6px}
#login .lock{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--ui-primary-soft);color:var(--accent);margin-bottom:14px}
#login .lock svg{width:28px;height:28px}
@media (max-width:600px){button.tab svg{width:16px;height:16px} header{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  header h1{font-size:18px} [data-theme-slot]{order:1} #who{order:2;flex-basis:100%;gap:4px}
  #who button{font-size:13.5px;padding:0 10px;min-height:38px} #logout{margin-left:auto}}
</style>
</head>
<body>
<header>
  <h1>관리자 관제</h1>
  <span id="who" hidden>
    <button class="tab ghost on" data-tab="live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M6.5 11l3-3 2.5 2.5L17 7"/></svg>관제 모니터링</button>
    <button class="tab ghost" data-tab="staff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3.3 3-5 5.5-5s4.7 1.7 5.5 5"/><path d="m15 11 2 2 4-4"/></svg>반환·직원</button>
    <button class="tab ghost" data-tab="storage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18M12 4v16"/></svg>보관함</button>
    <button class="ghost" type="button" data-chatbot-open aria-label="AI 도우미 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"/></svg>AI</button>
    <button class="tab ghost" id="centerTab" data-tab="center" hidden>회수·통계</button>
    <button class="ghost" id="logout">로그아웃</button>
  </span>
  <span data-theme-slot></span>
</header>

<form id="login" autocomplete="off">
  <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="잠금: 관리자 전용"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.3"/></svg></div>
  <h2>관리자 로그인</h2>
  <p>비밀번호를 입력하세요.</p>
  <p id="err" role="alert"></p>
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" required>
  <button type="submit" style="width:100%">로그인</button>
</form>

<div id="app"><iframe id="frame" title="관리자 화면"></iframe></div>

<script>
const $ = s => document.querySelector(s);
const SRC = {live: '/live', staff: '/staff', center: '/center', storage: '/storage'};
function showApp(tab) {
  $('#login').style.display = 'none';
  $('#who').hidden = false; $('#app').classList.add('on');
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const f = $('#frame'); if (f.getAttribute('src') !== SRC[tab]) f.src = SRC[tab];
}
function showLogin(msg) {
  $('#who').hidden = true; $('#app').classList.remove('on'); $('#frame').removeAttribute('src');
  $('#login').style.display = 'block';
  $('#err').textContent = msg || ''; $('#err').classList.toggle('on', !!msg);
  $('#pw').focus();
}
async function check() {
  try {
    const d = await (await fetch('/api/admin/me', {cache: 'no-store'})).json();
    if (d.logged_in) {
      try {
        const r = await fetch('/api/admin/center-enabled', {cache: 'no-store'});
        $('#centerTab').hidden = !r.ok || !(await r.json()).enabled;
      } catch (_) { $('#centerTab').hidden = true; }
      showApp('live');
    } else showLogin();
  } catch (e) { showLogin('관제탑에 연결할 수 없어요'); }
}
$('#login').onsubmit = async e => {
  e.preventDefault();
  try {
    const r = await fetch('/api/admin/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: $('#pw').value})});
    $('#pw').value = '';
    if (r.ok) return check();
    showLogin(r.status === 429 ? '잠시 뒤에 다시 시도하세요 (1분 잠금)' : '비밀번호가 맞지 않아요');
  } catch (e) { showLogin('관제탑에 연결할 수 없어요'); }
};
$('#logout').onclick = async () => { try { await fetch('/api/admin/logout', {method: 'POST'}); } catch (e) {} showLogin(); };
document.querySelectorAll('.tab').forEach(b => b.onclick = () => showApp(b.dataset.tab));
check();
</script>
<!-- 11/6 관제 도우미: 이용 안내 + 관제 질문(반환 현황·실패 원인). 관리자 로그인이 안 됐으면 관제 질문은 401 로 막힌다 -->
<script src="/chat-widget/widget.js?v=20261113a" data-mode="staff" defer></script>
</body>
</html>
