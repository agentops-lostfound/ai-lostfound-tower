<text x="800" y="567.32" fill="#53657A" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" text-anchor="middle">조사 대상: 1,001개 제조사 중 238개 응답 업체. 전체 산업 추정치가 아니며 연도별 표본이 달라짐.</text>
