<text x="800" y="668.32" fill="#53657A" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400" text-anchor="middle">출처: IFR, World Robotics 2026 발표자료 28–30쪽 및 공식 서비스 로봇 보도자료 · 2026.11.12 확인</text>
