# main 병합 알림 (LF-17) — PR 이 main 에 합쳐질 때마다 팀 디스코드(AgentOps)에 한 줄 요약을 올린다
# - GitHub 서버에서 돌기 때문에 교육원 PC·2조봇이 꺼져 있어도 올라간다
# - 웹후크 주소는 저장소 비밀값 DISCORD_WEBHOOK_MERGE 에만 둔다(코드·로그에 쓰지 않음). 없으면 조용히 건너뛴다
# - 시험: Actions 탭 → "main 병합 알림" → Run workflow (pr 칸을 비우면 시험 메시지 1개, 번호를 넣으면 그 PR 알림)
# - 자동 병합(tests.yml automerge)은 GITHUB_TOKEN 병합이라 아래 pull_request 이벤트가 안 생긴다 → 자동 병합 작업이 pr 번호를 넣어 직접 실행한다
# - 메시지에는 PR 번호·제목·담당·변경 규모만 싣는다(본문·개인정보 없음), @멘션은 울리지 않게 막는다
name: main 병합 알림

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "알릴 PR 번호(비우면 시험 메시지)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 디스코드에 병합 알림 보내기
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_MERGE }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          ACTOR: ${{ github.actor }}
          PR_INPUT: ${{ github.event.inputs.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK}" ]; then
            echo "DISCORD_WEBHOOK_MERGE 비밀값이 없어 건너뜁니다(설정: Settings > Secrets and variables > Actions)"
            exit 0
          fi
          case "${WEBHOOK}" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *) echo "DISCORD_WEBHOOK_MERGE 형식이 디스코드 웹후크 주소가 아닙니다"; exit 1 ;;
          esac
          # GitHub 아이디 → 팀원 이름(없으면 아이디 그대로)
          NAMES='{"bjw0505-del":"변재원","rjsxo943-gif":"김건태","pil2ya":"이순필","01xooyeon":"정연우","gimjaemin4545-cmd":"김재민","github-actions[bot]":"자동 병합"}'
          EVENT_FILE="$GITHUB_EVENT_PATH"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${PR_INPUT:-}" ]; then
            case "${PR_INPUT}" in *[!0-9]*) echo "pr 칸에는 숫자만"; exit 1 ;; esac
            gh api "repos/${REPO}/pulls/${PR_INPUT}" | jq '{pull_request: .}' > pr_event.json
            if [ "$(jq -r '.pull_request.merged' pr_event.json)" != "true" ]; then echo "PR #${PR_INPUT} 은 아직 병합되지 않아 알리지 않습니다"; exit 0; fi
            EVENT_FILE=pr_event.json
            EVENT_NAME=pull_request
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            PAYLOAD=$(jq -n --arg names "$NAMES" --arg actor "$ACTOR" --arg url "${SERVER}/${REPO}" '
              ($names | fromjson) as $n |
              {allowed_mentions: {parse: []},
               embeds: [{title: "🧪 main 병합 알림 시험",
                         description: ("알림 연결 확인용 메시지입니다. 실행: " + ($n[$actor] // $actor)),
                         url: $url, color: 15229964}]}')
          else
            PAYLOAD=$(jq --arg names "$NAMES" '
              ($names | fromjson) as $n | .pull_request as $p |
              ($p.title | if length > 200 then .[0:199] + "…" else . end) as $title |
              {allowed_mentions: {parse: []},
               embeds: [{title: ("🔀 main 병합 · PR #" + ($p.number | tostring)),
                         url: $p.html_url,
                         color: 5189434,
                         description: ([
                           ("**" + $title + "**"),
                           ("담당: " + ($n[$p.user.login] // $p.user.login) + " · 브랜치 `" + $p.head.ref + "`"),
                           ("변경: 파일 " + ($p.changed_files | tostring) + "개 (+" + ($p.additions | tostring) + " / −" + ($p.deletions | tostring) + ") · 커밋 " + ($p.commits | tostring) + "개"),
                           ("합친 사람: " + ($n[$p.merged_by.login // ""] // ($p.merged_by.login // "알 수 없음")))
                         ] | join("\n")),
                         timestamp: $p.merged_at}]}' "$EVENT_FILE")
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK")
          echo "디스코드 응답: HTTP ${CODE}"
          case "$CODE" in 2*) ;; *) exit 1 ;; esac
