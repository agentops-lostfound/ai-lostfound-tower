# PR 자동 시험 (CI) — PR 을 올리거나 고칠 때마다 시험 전체를 실행한다
# main 보호 규칙에서 이 시험("tests")이 통과해야 병합할 수 있다
# 변재원 PR(작성자 bjw0505-del + 브랜치에 -jaewon-)은 시험이 통과하면 자동 병합된다(11/3 결정). 팀원 PR 은 각자 직접 Merge
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt
      - name: 전체 시험
        run: python -m unittest discover -s tests -v

  automerge:
    # 시험 통과 뒤에만. 같은 저장소 브랜치 + 작성자 bjw0505-del + 브랜치 이름에 -jaewon- + 초안 아님
    needs: tests
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'bjw0505-del' &&
      contains(github.event.pull_request.head.ref, '-jaewon-') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: 자동 병합(병합 후 브랜치 삭제)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --merge
      # GITHUB_TOKEN 으로 한 병합은 다른 작업(병합 알림)을 깨우지 않는다 → 알림 작업을 직접 실행(이건 허용됨)
      - name: 병합 알림 실행 요청
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run merge-notify.yml --repo "${{ github.repository }}" --ref main -f pr="${{ github.event.pull_request.number }}"
