# PR 자동 시험 (CI) — PR 을 올리거나 고칠 때마다 시험 전체를 실행한다
# main 보호 규칙에서 이 시험("tests")이 통과해야 병합할 수 있다
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt
      - name: 전체 시험
        run: python -m unittest discover -s tests -v
